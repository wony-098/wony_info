<!DOCTYPE html>

<head>

            padding-bottom: 100px;
        }
        .content-container {
            background-color: #ffffff;

            padding: 30px;
            border-radius: 12px;

            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-symbol {

            margin-top: 25px;
            margin-bottom: 15px;
            color: #FFB7C5;
        }
        .home-btn-left {
            position: fixed;
            bottom: 25px;
            left: 25px;
            padding: 10px 24px;
            background-color: #212529;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;

        .home-btn-left:hover {
